# Synthetic example: replace the example Project, Username, and script path
# before applying. The path references an existing script on the scheduler;
# create/apply never uploads a local script.
name: list-allfiles-ready
project: example-project
version: v1
enabled: true
machine: perlmutter
sfapi_username: example-user
pipeline:
  input_type: s3_bucket_events
  matchers:
    event_type: s3.object.created
    s3_bucket: cfs
    path_regex: '^\d{4}-\d{2}-\d{2}/.*\.list\.allfiles$'
  outputs:
    mode: start_job
    job_spec:
      source: path
      # Account is optional for a scheduler-hosted path under the backend contract.
      path: /scheduler/jobs/process-list-allfiles.sh
